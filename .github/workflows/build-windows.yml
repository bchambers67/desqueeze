name: Build Windows App

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "DesqueezeWindows/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore DesqueezeWindows/DesqueezeWindows.csproj

      - name: Publish (self-contained single-file exe)
        run: >
          dotnet publish DesqueezeWindows/DesqueezeWindows.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o dist-ci

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Desqueeze-Windows
          path: dist-ci/Desqueeze.exe
          retention-days: 90
